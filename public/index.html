<style>
  body { display: flex; flex-direction: column; }
  .logo { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; letter-spacing: .01em; }
  .logo span { color: var(--accent); }
  .logo-sub { font-size: .85rem; color: var(--muted); margin-top: 2px; }
  .hero { text-align: center; padding: 52px 24px 36px; }
  .hero h2 { font-family: var(--font-serif); font-size: 2.1rem; font-weight: 700; margin-bottom: 10px; }
  .hero p { color: var(--muted); font-size: 1rem; max-width: 480px; margin: 0 auto; }
  .countdown {
    display: inline-flex; align-items: baseline; gap: 8px; margin-top: 18px;
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    border-radius: 999px; padding: 8px 22px; animation: fadeUp .4s ease both;
  }
  .countdown .num { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; color: var(--gold-txt); font-variant-numeric: tabular-nums; }
  .countdown .txt { font-size: .85rem; color: var(--gold-txt); }
  .dash { max-width: 960px; margin: 0 auto 36px; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; animation: fadeUp .35s ease both; }
  .dash-card .d-lbl { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .dash-card .d-val { font-size: 1.45rem; font-weight: 700; color: var(--accent); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .dash-card .d-sub { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  .dash-bar { height: 6px; background: var(--border-soft); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .dash-bar > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  .dash-bar > div.over { background: var(--danger); }
  .sections { max-width: 960px; margin: 0 auto; padding: 0 24px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .section-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 26px 24px 20px; text-decoration: none; color: var(--text);
    display: flex; flex-direction: column; gap: 10px;
    transition: box-shadow .18s, border-color .18s, transform .18s;
    animation: fadeUp .35s ease both;
  }
  .section-card:hover { box-shadow: var(--shadow-lg); border-color: var(--accent); transform: translateY(-3px); }
  .card-icon { font-size: 2.1rem; line-height: 1; }
  .card-title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; }
  .card-desc { font-size: .85rem; color: var(--muted); line-height: 1.5; flex: 1; }
  .card-stat { font-size: .8rem; font-weight: 600; color: var(--accent-dk); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 10px; padding: 3px 12px; width: fit-content; }
  [data-theme="dark"] .card-stat { color: var(--accent); }
  footer { margin-top: auto; text-align: center; padding: 20px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--border); background: var(--surface); }
  @media (max-width: 600px) {
    .logo { font-size: 1.4rem; }
    .hero { padding: 32px 18px 24px; }
    .hero h2 { font-size: 1.6rem; }
    .hero p { font-size: .92rem; }
    .countdown { padding: 8px 16px; margin-top: 14px; }
    .countdown .num { font-size: 1.3rem; }
    .dash { padding: 0 14px; gap: 12px; grid-template-columns: 1fr 1fr; }
    .dash-card { padding: 14px 14px; }
    .dash-card .d-val { font-size: 1.3rem; }
    .sections { padding: 0 14px 40px; gap: 14px; grid-template-columns: 1fr; }
    .section-card { padding: 20px 18px 16px; }
  }
</style>

<header>
  <div>
    <div class="logo">Day <span>Special</span></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="theme-toggle" title="Tema chiaro/scuro">🌙</button>
  </div>
</header>

<div class="hero">
  <h2>Benvenuto nel tuo planner 💍</h2>
  <div class="countdown" id="countdown" style="display:none">
    <span class="num" id="cd-num"></span>
    <span class="txt" id="cd-txt"></span>
  </div>
</div>

<div class="dash" id="dash"></div>

<div class="sections">
  <a class="section-card" href="#/invitati">
    <div class="card-icon">👥</div>
    <div class="card-title">Invitati</div>
    <div class="card-desc">Gestisci la lista degli invitati, i gruppi famiglia, gli stati degli inviti e il costo del menù.</div>
    <div class="card-stat" id="stat-invitati">—</div>
  </a>
  <a class="section-card" href="#/budget">
    <div class="card-icon">💰</div>
    <div class="card-title">Budget</div>
    <div class="card-desc">Tieni traccia delle spese per categoria, lo stato dei pagamenti e il saldo disponibile.</div>
    <div class="card-stat" id="stat-budget">—</div>
  </a>
  <a class="section-card" href="#/fornitori">
    <div class="card-icon">📋</div>
    <div class="card-title">Fornitori</div>
    <div class="card-desc">Gestisci contatti, preventivi e stato del contratto di fotografi, catering, fioristi e altri fornitori.</div>
    <div class="card-stat" id="stat-fornitori">—</div>
  </a>
  <a class="section-card" href="#/programma">
    <div class="card-icon">🗓️</div>
    <div class="card-title">Programma</div>
    <div class="card-desc">Costruisci la timeline della giornata con eventi, orari, luoghi e note. Riordinabile con drag & drop.</div>
    <div class="card-stat" id="stat-programma">—</div>
  </a>
  <a class="section-card" href="#/tavoli">
    <div class="card-icon">🪑</div>
    <div class="card-title">Tavoli</div>
    <div class="card-desc">Crea i tavoli e assegna gli ospiti confermati con drag & drop. Si sincronizza con la lista invitati.</div>
    <div class="card-stat" id="stat-tavoli">—</div>
  </a>
  <a class="section-card" href="#/checklist">
    <div class="card-icon">✅</div>
    <div class="card-title">Checklist</div>
    <div class="card-desc">Tutte le attività ordinate per fase temporale, dai 12 mesi prima al dopo-nozze. Già precompilata e con aggiunta, modifica ed eliminazione libere.</div>
    <div class="card-stat" id="stat-checklist">—</div>
  </a>
  <a class="section-card" href="#/impostazioni">
    <div class="card-icon">⚙️</div>
    <div class="card-title">Impostazioni</div>
    <div class="card-desc">Versione dell'app e aggiornamento software.</div>
    <div class="card-stat" id="stat-impostazioni">—</div>
  </a>
</div>

<footer>
  <div>Day Special</div>
  <div style="margin-top:4px">Sviluppato con ❤️ da Francesco Maria De Santis</div>
</footer>

<style>
  .budget-input-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 24px; margin-bottom: 24px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

<header>

  <h1>Day <span>Special</span> — Budget</h1>
  <div class="header-actions">

    <button class="btn btn-ghost btn-sm" id="btn-print" title="Stampa il budget">🖨 Stampa</button>
    <button class="icon-btn" id="theme-toggle">🌙</button>
  </div>
</header>
<div class="container">
  <details class="collapsible">
    <summary>📊 Riepilogo budget</summary>

      <div class="stat-card warn"><div class="val" id="s-preventivato">€ 0</div><div class="lbl">Preventivato</div></div>
      <div class="stat-card success"><div class="val" id="s-pagato">€ 0</div><div class="lbl">Pagato</div></div>
      <div class="stat-card"><div class="val" id="s-rimanente">€ 0</div><div class="lbl">Rimanente</div></div>
      <div class="stat-card danger"><div class="val" id="s-sforamento">€ 0</div><div class="lbl">Sforamento</div></div>
    </div>
  </details>
  <details class="collapsible">
    <summary>💰 Budget totale e catering</summary>
    <div class="budget-input-bar collapse-inner">
      <label>💰 Budget totale:</label>
      <input type="number" id="input-budget-totale" min="0" step="100" placeholder="es. 20000" />
      <span class="import-hint">Catering (da Invitati):</span>
      <strong id="costo-catering" style="color:var(--accent-dk)">—</strong>
      <button class="btn-import" id="btn-importa-catering">↓ Importa come voce</button>
    </div>
  </details>
  <div class="progress-wrap">
    <div class="progress-label"><span>Preventivato sul budget</span><span id="progress-pct">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="chart-wrap" id="chart-wrap" style="display:none">
    <h2>📊 Spese per categoria</h2>
    <div class="chart-legend">
      <span><span class="dot" style="background:var(--accent);opacity:.35"></span>Preventivato</span>
      <span><span class="dot" style="background:var(--accent)"></span>Pagato</span>
    </div>
    <div id="chart-rows"></div>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" id="btn-open-form">+ Aggiungi voce</button>
    <select class="filter-select" id="filter-cat"><option value="">Tutte le categorie</option></select>
    <select class="filter-select" id="filter-stato">
      <option value="">Tutti gli stati</option>
      <option value="da_pagare">Da pagare</option>
      <option value="acconto">Acconto versato</option>
      <option value="saldato">Saldato</option>
    </select>
  </div>
  <div class="add-form" id="add-form">
    <h3 id="form-title">Nuova voce di spesa</h3>
    <div class="form-grid">
      <div class="form-group full"><label>Descrizione *</label><input type="text" id="f-descrizione" placeholder="Es. Fotografo" /></div>
      <div class="form-group">
        <label>Categoria *</label>
        <select id="f-categoria">
          <option value="Ricevimento">Ricevimento</option>
          <option value="Cerimonia">Cerimonia</option>
          <option value="Fotografia">Fotografia</option>
          <option value="Fiori">Fiori & Decorazioni</option>
          <option value="Musica">Musica & Intrattenimento</option>
          <option value="Abbigliamento">Abbigliamento</option>
          <option value="Viaggio">Viaggio di Nozze</option>
          <option value="Partecipazioni">Partecipazioni & Bomboniere</option>
          <option value="Altro">Altro</option>
        </select>
      </div>
      <div class="form-group"><label>Preventivo (€)</label><input type="number" id="f-preventivo" min="0" step="0.01" placeholder="0.00" /></div>
      <div class="form-group"><label>Pagato (€)</label><input type="number" id="f-pagato" min="0" step="0.01" placeholder="0.00" /></div>
      <div class="form-group">
        <label>Stato</label>
        <select id="f-stato">

<style>
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

  .progress-pct { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
  .stats-row { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
  .stat-pill { font-size: .8rem; padding: 3px 12px; border-radius: 12px; font-weight: 600; }
  .pill-todo { background: var(--border-soft); color: var(--muted); }
  .pill-wip  { background: var(--accent-soft); color: var(--gold-txt); }
  .pill-done { background: var(--success-soft); color: var(--success); }
  .group-section { margin-bottom: 24px; }
  .group-title { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 0 6px; border-bottom: 2px solid var(--border); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .item-list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); transition: border-color .15s, opacity .15s; animation: fadeUp .25s ease both; }
  .item.done { opacity: .6; }
  .item.done .item-titolo { text-decoration: line-through; color: var(--muted); }
  .item-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .item-check.done { background: var(--success); border-color: var(--success); }
  .item-check.wip  { background: var(--warning); border-color: var(--warning); }
  .item-check::after { content: '✓'; color: #fff; font-size: .75rem; display: none; }
  .item-check.done::after { display: block; }
  .item-titolo { flex: 1; font-size: .9rem; font-weight: 500; }
  .item-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .prio-badge { font-size: .7rem; padding: 2px 8px; border-radius: 8px; font-weight: 700; }
  .prio-alta  { background: var(--danger-soft); color: var(--danger); }

  .item-note { font-size: .78rem; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-actions { display: flex; gap: 5px; opacity: 0; transition: opacity .15s; }
  .item:hover .item-actions { opacity: 1; }
  @media (max-width: 600px) {
    .item { flex-wrap: wrap; }

    .item-actions { order: 5; margin-left: auto; opacity: 1; }
  }
</style>
