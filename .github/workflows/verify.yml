name: Verifica

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Sintassi JavaScript
        run: |
          git ls-files '*.js' '*.mjs' | while IFS= read -r file; do
            node --check "$file" || exit 1
          done
      - run: npm test
      - run: npm run build
      - name: Bundle allineato
        run: git diff --exit-code -- public/index.html
      - run: npm run smoke
